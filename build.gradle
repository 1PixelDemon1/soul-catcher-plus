plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
layout.buildDirectory = layout.projectDirectory.dir('build/1.19.2')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run/1.19.2')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            args '--mixin', 'soulcatcherplus.mixins.json'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client { workingDirectory project.file('run-client/1.19.2') }
        server { args '--nogui' }
    }
}
if (project.hasProperty('gameTests')) {
    sourceSets.main.java.srcDir 'src/qa/java'
}
repositories {
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
configurations { playtestMods { transitive = false } }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (project.hasProperty('withPatchouli')) runtimeOnly fg.deobf('maven.modrinth:patchouli:1.19.2-77-forge')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (project.hasProperty('withTwilightForest')) runtimeOnly fg.deobf('curse.maven:the-twilight-forest-227639:4389567')
    if (project.hasProperty('withMowzies')) {
        runtimeOnly fg.deobf('curse.maven:mowzies-mobs-250498:5180680')
        runtimeOnly fg.deobf('curse.maven:geckolib-388172:4407241')
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }

}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Version': mod_version, 'MixinConfigs': 'soulcatcherplus.mixins.json' }
    finalizedBy 'reobfJar'
}
