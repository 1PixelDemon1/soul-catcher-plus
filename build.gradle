plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
layout.buildDirectory = layout.projectDirectory.dir('build/1.20.4')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
neoForge {
    version = neo_version
    runs {
        configureEach {
            gameDirectory = project.file('run/1.20.4')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
        client { client(); gameDirectory = project.file('run-client/1.20.4') }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
if (project.hasProperty('gameTests')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (project.hasProperty('withTwilightForest')) {
        runtimeOnly 'curse.maven:the-twilight-forest-227639:5320183'
    }
    if (project.hasProperty('withAoA')) {
        runtimeOnly 'curse.maven:advent-of-ascension-nevermine-311054:5285649'
    }
}
if (project.hasProperty('withMowzies') || project.hasProperty('withIceAndFire')) {
    throw new GradleException('This 1.20.4 port supports the AoA and Twilight Forest playtest flags only.')
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Version': mod_version, 'MixinConfigs': 'soulcatcherplus.mixins.json' }
}

tasks.register('playtestZip', Zip) {
    group = 'build'
    description = 'Packages the standalone mod with the pinned AoA and Twilight Forest JARs.'
    dependsOn tasks.named('jar')
    archiveFileName = "soulcatcherplus-${minecraft_version}-aoa-twilight-playtest.zip"
    destinationDirectory = layout.buildDirectory.dir('playtest')
    from(tasks.named('jar')) { into 'mods' }
    from(provider {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'curse.maven'
        }.collect { it.file }
    }) {
        into 'mods'
        rename 'advent-of-ascension-nevermine-311054-5285649.jar', 'AoA3-1.20.4-3.7.7.jar'
        rename 'the-twilight-forest-227639-5320183.jar', 'twilightforest-1.20.4-4.4.2276-universal.jar'
    }
    from('docs/PLAYTEST_1.20.4.md') { rename { 'README.md' } }
    doFirst {
        if (project.hasProperty('gameTests') || !project.hasProperty('withAoA') || !project.hasProperty('withTwilightForest')) {
            throw new GradleException('Use playtestZip -PwithAoA -PwithTwilightForest without -PgameTests.')
        }
    }
}
