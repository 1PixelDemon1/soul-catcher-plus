plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
layout.buildDirectory = layout.projectDirectory.dir('build/1.16.5')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
// One development addon today; keep its classes and resources out of the core JAR.
sourceSets {
    compat {
        java.srcDirs = ['addons/compat/src/main/java']
        resources.srcDirs = ['addons/compat/src/main/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    compatImplementation.extendsFrom implementation
    compatCompileOnly.extendsFrom compileOnly
    compatAnnotationProcessor.extendsFrom annotationProcessor
    compatRuntimeOnly.extendsFrom runtimeOnly
}
sourceSets.compat.compileClasspath += sourceSets.main.compileClasspath
sourceSets.compat.runtimeClasspath += sourceSets.main.runtimeClasspath
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run/1.16.5')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            args '--mixin', 'soulcatcherplus.mixins.json'
            mods {
                "${mod_id}" { source sourceSets.main }
                if (!project.hasProperty('withoutCompatAddon')) {
                    soulcatcherplus_compat { source sourceSets.compat }
                }
            }
            if (!project.hasProperty('withoutCompatAddon')) args '--mixin', 'soulcatcherplus_compat.mixins.json'
        }
        client { workingDirectory project.file('run-client/1.16.5') }
        server { args '--nogui' }
    }
}
if (project.hasProperty('gameTests')) {
    sourceSets.main.java.srcDir 'src/qa/java'
}
repositories {
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
configurations { playtestMods { transitive = false } }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compile modern syntax to Java 8; this plugin is never a runtime dependency.
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
    compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (project.hasProperty('withTwilightForest')) {
        runtimeOnly fg.deobf('curse.maven:the-twilight-forest-227639:3575220')
        playtestMods 'curse.maven:the-twilight-forest-227639:3575220'
    }
    if (project.hasProperty('withAquamirae')) {
        runtimeOnly fg.deobf('maven.modrinth:8BmcQJ2H:UQGoJDhn')
        playtestMods 'maven.modrinth:8BmcQJ2H:UQGoJDhn'
    }
    if (project.hasProperty('withAquamirae')) {
        runtimeOnly fg.deobf('curse.maven:aquamirae-536254:4420334')
        runtimeOnly fg.deobf('curse.maven:obscure-api-638417:4420298')
        playtestMods 'curse.maven:aquamirae-536254:4420334'
        playtestMods 'curse.maven:obscure-api-638417:4420298'
    }
}
if (project.hasProperty('withMowzies') || project.hasProperty('withIceAndFire')) {
    throw new GradleException('The 1.16.5 playtest configuration provides Twilight Forest and Aquamirae only.')
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
    // Forge 1.16.5's mod list reads logos through getRootResource (filenames only).
    from('src/main/resources/assets/soulcatcherplus/textures/entity/soul_remnant/medium.png') {
        rename { 'logo.png' }
    }
}
tasks.named('processCompatResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Version': mod_version, 'MixinConfigs': 'soulcatcherplus.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.register('compatJar', Jar) {
    group = 'build'
    description = 'Builds the separate combined mod-integration addon.'
    archiveBaseName = 'soulcatcherplus-compat'
    from sourceSets.compat.output
    manifest { attributes 'Implementation-Version': mod_version, 'MixinConfigs': 'soulcatcherplus_compat.mixins.json' }
    finalizedBy 'reobfCompatJar'
}
reobf { compatJar {} }
tasks.named('assemble').configure { dependsOn 'reobfCompatJar' }

tasks.register('playtestZip', Zip) {
    group = 'build'
    description = 'Packages the core, integration addon, Twilight Forest, Aquamirae and their libraries.'
    dependsOn 'reobfJar', 'reobfCompatJar'
    archiveFileName = "soulcatcherplus-${minecraft_version}-twilight-aquamirae-playtest.zip"
    destinationDirectory = layout.buildDirectory.dir('playtest')
    from(tasks.named('jar')) { into 'mods' }
    from(tasks.named('compatJar')) { into 'mods' }
    from(configurations.playtestMods) {
        into 'mods'
        rename '8BmcQJ2H-UQGoJDhn.jar', 'geckolib-forge-1.16.5-3.0.106.jar'
        rename 'the-twilight-forest-227639-3575220.jar', 'twilightforest-1.16.5-4.0.870-universal.jar'
        rename 'aquamirae-536254-4420334.jar', 'aquamirae-5.4.API11.jar'
        rename 'obscure-api-638417-4420298.jar', 'obscure_api-11.jar'
    }
    from('docs/PLAYTEST_1.16.5.md') { rename { 'README.md' } }
    doFirst {
        if (project.hasProperty('gameTests') || !project.hasProperty('withTwilightForest') || !project.hasProperty('withAquamirae')) {
            throw new GradleException('Use playtestZip -PwithTwilightForest -PwithAquamirae without -PgameTests.')
        }
    }
}
